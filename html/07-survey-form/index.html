<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Survey Form</title>
  </head>

  <body> 
    <header>
        <h1 id="title">Book Reading Survey</h1> 
        <p id="description">Tell us about your reading habits and favorite types of books.</p>
    </header> 

    <main>
        <form id="survey-form"> 

            <fieldset>
              <legend>Personal Information</legend>

                <label id="name-label" for="name">Name:</label> 
                <input id="name" type="text" placeholder="e.g., Salvatore" required> 

                <label id="email-label" for="email">Email:</label> 
                <input id="email" type="email" required placeholder="example@gmail.com"> 

                <label id="number-label" for="number">Age:</label> 
                <input id="number" type="number" min="0" max="100" placeholder="28">

            </fieldset> 

            <fieldset>
              <legend>Reading Habits</legend>

              <label id="dropdown-label" for="dropdown">How often do you read?</label> 
              <select id="dropdown"> 
                  <option>Every day</option> 
                  <option>A few times a week</option> 
                  <option>Once a week</option> 
                  <option>A few times a month</option> 
                  <option>Rarely</option> 
              </select> 

              <label id="genre">What is your favorite book genre?</label> 

              <input id="fiction" type="radio" name="genre" value="fiction"> 
              <label for="fiction">Fiction</label> 

              <input id="fantasy" type="radio" name="genre" value="fantasy"> 
              <label for="fantasy">Fantasy</label> 

              <label>Which types of books do you enjoy?</label> 

              <input id="fiction-book" type="checkbox" value="fiction"> 
              <label for="fiction-book">Fiction</label> 

              <input id="fantasy-book" type="checkbox" value="fantasy"> 
              <label for="fantasy-book">Fantasy</label> 

              <input id="mystery" type="checkbox" value="mystery"> 
              <label for="mystery">Mystery</label> 

              <input id="science-fiction" type="checkbox" value="science-fiction"> 
              <label for="science-fiction">Science Fiction</label> 

              <input id="biography" type="checkbox" value="biography"> 
              <label for="biography">Biography</label> 

              <label for="comments">Additional comments:</label> 
              <textarea id="comments" placeholder="Tell us more about your reading preferences..."></textarea> 

              <input id="submit" type="submit" value="Submit"> 

            </fieldset>

        </form> 
    </main>
  </body>
  
</html>
