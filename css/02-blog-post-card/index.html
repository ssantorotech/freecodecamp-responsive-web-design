<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Post Card</title>
    <link href="styles.css" rel="stylesheet" >
</head>
<body>
    <div class="blog-post-card">
       <img src="https://cdn.freecodecamp.org/curriculum/labs/cover-photo.jpg"
     class="post-img"
     alt="A developer working on a laptop">

        <div class="post-content">
            <h2 class="post-title">Building Better Websites</h2>

            <p class="post-excerpt">
                Discover practical tips and techniques for creating clean, responsive, and user-friendly websites.
            </p>

            <a class="read-more">Read More</a>
        </div>
    </div>
</body>
</html>
