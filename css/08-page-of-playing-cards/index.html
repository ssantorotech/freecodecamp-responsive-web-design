<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playing Cards</title>
  <link href="styles.css" rel="stylesheet" />
</head>

<body>
  <main id="playing-cards">
    <div class="card">
      <div class="left">♠</div>
      <div class="middle">♠</div>
      <div class="right">♠</div>
    </div>

    <div class="card">
      <div class="left hearts">♥</div>
      <div class="middle hearts">♥</div>
      <div class="right hearts">♥</div>
    </div>

    <div class="card">
      <div class="left diamonds">♦</div>
      <div class="middle diamonds">♦</div>
      <div class="right diamonds">♦</div>
    </div>
  </main>
</body>

</html>
