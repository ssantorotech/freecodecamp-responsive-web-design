<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Build an Event Flyer Page</title>
  <link href="styles.css" rel="stylesheet">
</head>

<body>
  <header>
    <img class="header-image" src="https://cdn.freecodecamp.org/curriculum/labs/event.jpg" alt="flags strung from roof to roof">
    <h1 id="event-title">International Cultural Festival</h1>
  </header>
  
  <main>
    <section>
      <h2 class="sub-title-event">Live Music and Performances</h2>
      <p class="event-description">Enjoy live music, traditional dances, and exciting performances from artists around the world.</p>
    </section>

    <hr>

    <section>
      <h2 class="sub-title-event">Food, Culture and Activities</h2>
      <p class="event-description">Discover international food, cultural traditions, local crafts, and fun activities for everyone.</p>
    </section>
  </main>
</body>

</html>
